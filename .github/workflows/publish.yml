name: Publish @wjx-ai/dsh-wx-reader to npm

# 通过 npm Trusted Publishing(OIDC)发布:无需任何长期 token/恢复码。
# 前置:在 npm 账号为 @wjx-ai/dsh-wx-reader 配置 Trusted Publishing,
#       并把本仓库 + 本工作流(Publish)授权为受信任的发布者(工作流文件名: publish.yml)。
#
# 发布流程(维护者):
#   1. 改 package.json 的 version(语义化版本)。
#   2. 提交推送,并打一个 v* 标签:
#        git add -A && git commit -m "chore: release X.Y.Z" && git push origin main
#        git tag vX.Y.Z && git push origin vX.Y.Z
#   3. 本工作流检测到 v* 标签后,用 OIDC 自动执行 npm publish --provenance(带 SLSA provenance 证据)。
#
# 触发:推送 v* 标签(或手动触发 workflow_dispatch)。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # 本包无第三方依赖、无构建步骤,直接发布 files 清单里的文件。
      # trusted publishing 要求 npm CLI >= 11.5.1 且 Node >= 22.14 (故用 node 24)。
      # 这里不设 NODE_AUTH_TOKEN,让 npm 用 OIDC 身份自动认证。
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ""
